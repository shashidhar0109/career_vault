    <script>
      // Defensive patch: Ensure window.fetch has both getter and setter
      // so polyfills or third-party wrappers cannot fail with "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = window.fetch;
          var fetchDescriptor = {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          };
          Object.defineProperty(window, 'fetch', fetchDescriptor);
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (_) {}
          }
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>

  </body>
